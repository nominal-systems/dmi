# Site settings. Served by GitHub Pages from the `docs/` folder of `master`
# (the classic "deploy from a branch" mode), which builds with the
# `github-pages` gem, so the Gemfile here pins the same gem to keep local builds
# identical to what is published.

title: Diagnostic Modality Integrator
description: >-
  DMI is a suite of components that connects to diagnostic providers (reference labs, point of care devices, etc) and
  exposes an API with a single interface for PIMS to implement to integrate with multiple diagnostic providers at once.
baseurl: "/dmi" # the subpath of your site, e.g. /blog
url: "https://nominal-systems.github.io" # the base hostname & protocol for your site
lang: en

github_org_url: https://github.com/nominal-systems
api_spec_url: https://nominal.stoplight.io/docs/dmi

# Header navigation, in order. Layouts and includes are local to this site
# (see _layouts/ and _includes/); no theme gem is used.
nav:
  - title: Release notes
    url: /release-notes/
  - title: Blog
    url: /blog/
  - title: About
    url: /about/

# Release notes are a collection, one document per PROD release, written by
# .github/workflows/prod-release-notes.yml (scripts/prod-release-notes/publish_page.py).
collections:
  release_notes:
    output: true
    permalink: /release-notes/:name/

defaults:
  - scope:
      path: ""
      type: release_notes
    values:
      layout: release-note

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  collections:
    - release_notes

show_excerpts: true

kramdown:
  input: GFM
  hard_wrap: false
  # Release notes contain raw HTML (<details>, <sub>); leave it untouched.
  parse_block_html: false

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
