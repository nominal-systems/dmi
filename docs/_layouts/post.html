---
layout: default
---
<article class="section">
  <div class="container prose">
    <header>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b %Y" }}</time>
        {%- if page.author %} &middot; {{ page.author | escape }}{% endif -%}
      </p>
      <h1>{{ page.title | escape }}</h1>
    </header>
    {{ content }}
    <p class="release-nav"><a href="{{ "/blog/" | relative_url }}">&larr; All posts</a></p>
  </div>
</article>
