title: Observation
description: |
  Laboratory and clinical or diagnostic data for patients and/or specimens derived from these.
type: object
properties:
  code:
    type: string
    description: Analyte code
    example: HEM
  name:
    type: string
    description: Analyte name
    example: Hemoglobin
  status:
    type: string
    description: |
      Status of the test result.
      
      - `PENDING` — Measurement has not been performed by the analyzer yet
      - `DONE` — The analyzer has performed the measurement
      - `CANCELLED` — The measurement has been cancelled
    enum:
      - PENDING
      - DONE
      - CANCELLED
    example: DONE
  valueString:
    type: string
    description: Text value of the result
    example: Visible
  valueQuantity:
    type: object
    description: Numerical value of the result
    properties:
      value:
        type: number
        description: Numerical value of the result
        example: 10.0
      units:
        type: string
        description: Unit of the result value
        example: g/dL
  units:
    type: string
    description: |
      Unit of the result value, at the observation level. Present whenever the
      diagnostic provider reports a unit, regardless of whether the value is
      numeric (`valueQuantity`) or textual (`valueString`). For numeric results
      this duplicates `valueQuantity.units`; consumers should read `units` here.
    example: g/dL
  media:
    type: array
    description: |
      Visual representations of the observation.
    items:
      $ref: '../types/Attachment.yaml'
  interpretation:
    type: object
    description: |
      Interpretation of the result value in the context of the reference ranges. Possible interpretation codes are:
      
      - N — Normal
      - A — Abnormal
      - LL — Critical low
      - L — Low
      - H — High
      - HH — Critical high
    properties:
      code:
        type: string
        description: Code of the interpretation
        example: N
        enum:
          - N
          - A
          - LL
          - L
          - H
          - HH
      text:
        type: string
        description: Text of the interpretation, as received from the diagnostic provider.
        example: Normal
  referenceRange:
    type: array
    description: Reference ranges of the test
    items:
      $ref: './ReferenceRange.yaml#/ReferenceRange'
  notes:
    type: string
    description: Notes about the result
    example: Measurement was performed in a non-sterile environment
required:
  - code
  - name
  - status
